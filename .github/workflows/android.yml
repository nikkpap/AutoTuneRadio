# Build → test → (on every push to main) publish a GitHub Release with the signed APK.
# The app checks these releases and offers the update in Settings → About.
name: Build & Release APK

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to create tags/releases

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key (secret SIGNING_KEYSTORE_BASE64)
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > app/autotune-debug.keystore
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Signing key restored."
          else
            echo "::warning title=No signing key::Secret SIGNING_KEYSTORE_BASE64 is missing. The APK is built with a throw-away key and NO release is published (it could not update the installed app). See README → 'GitHub: one-time setup'."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Version
        id: ver
        run: |
          BASE=$(grep -oP 'val baseVersion = "\K[^"]+' app/build.gradle.kts)
          VERSION="$BASE.$BUILD_NUMBER"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building AutoTune Radio $VERSION"

      - name: Core Java checks (reminders, logs, ICS)
        run: bash verification/run-core-checks.sh

      - name: Build APK, unit tests, lint
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug testDebugUnitTest lintDebug

      - name: Collect APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/AutoTuneRadio-v${{ steps.ver.outputs.version }}.apk"
          cd dist && sha256sum *.apk | tee SHA256SUMS.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoTuneRadio-v${{ steps.ver.outputs.version }}
          path: dist/

      - name: Upload reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.run_number }}
          path: |
            app/build/reports/
            app/build/test-results/

      - name: Release notes
        if: github.event_name == 'push' && steps.key.outputs.signed == 'true' && !contains(github.event.head_commit.message, '[no release]')
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          {
            echo "$MSG"
            echo
            echo "---"
            echo "Εγκατάσταση / Install: AutoTune Radio → Ρυθμίσεις → Σχετικά → **Έλεγχος για ενημερώσεις**, ή κατέβασε το APK παρακάτω."
          } > notes.md

      - name: Publish GitHub Release
        if: github.event_name == 'push' && steps.key.outputs.signed == 'true' && !contains(github.event.head_commit.message, '[no release]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: AutoTune Radio ${{ steps.ver.outputs.version }}
          body_path: notes.md
          files: |
            dist/AutoTuneRadio-v${{ steps.ver.outputs.version }}.apk
            dist/SHA256SUMS.txt
          make_latest: true
